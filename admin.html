<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin - Board Game Store</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

<div id="loginPage" class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded shadow w-80 border-t-4 border-red-500">
        <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Admin Login</h2>
        <input id="user" type="text" placeholder="Username" class="border w-full p-2 mb-3 rounded outline-none focus:ring-2 focus:ring-red-300">
        <input id="pass" type="password" placeholder="Password" class="border w-full p-2 mb-4 rounded outline-none focus:ring-2 focus:ring-red-300">
        <button onclick="login()" class="bg-red-500 text-white w-full py-2 rounded font-bold hover:bg-red-600 transition shadow-md">Login</button>
    </div>
</div>

<div id="adminPage" class="hidden">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Game Manager</h1>
        <div class="flex gap-2">
            <button onclick="goHome()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition font-bold">หน้าแรก</button>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition font-bold">Logout</button>
        </div>
    </div>

   <div class="grid grid-cols-2 gap-4 mb-6 text-center">
    <div class="bg-white text-black p-6 rounded-lg shadow-md border border-gray-200">
        <p class="text-sm font-medium text-gray-600">จำนวนเกมทั้งหมด</p>
        <h2 id="totalGames" class="text-5xl font-bold mt-2">0</h2>
    </div>

    <div class="bg-white text-black p-6 rounded-lg shadow-md border border-gray-200">
        <p class="text-sm font-medium text-gray-600">หมวดหมู่ทั้งหมด</p>
        <h2 id="totalCategories" class="text-5xl font-bold mt-2">0</h2>
    </div>
</div>

    <div class="bg-white p-6 rounded shadow-md mb-6 border-l-8 border-purple-500">
        <h3 class="font-bold mb-4 text-xl text-purple-700">จัดการหมวดหมู่</h3>
        <div class="flex gap-3 mb-6 items-center">
            <input id="newCatInput" placeholder="ชื่อหมวดหมู่ใหม่" class="border p-2 rounded w-72 outline-none focus:ring-2 focus:ring-purple-300">
            <button onclick="addCategory()" class="bg-green-500 text-white px-8 py-2 rounded hover:bg-green-600 transition font-bold shadow">
                Add หมวดหมู่
            </button>
        </div>
        <table class="w-full text-sm text-left border rounded-lg overflow-hidden">
            <thead class="bg-gray-100 text-gray-700">
                <tr>
                    <th class="p-3 border pl-6 font-bold">ชื่อหมวดหมู่</th>
                    <th class="p-3 border text-center font-bold" style="width: 180px;">จัดการ</th>
                </tr>
            </thead>
            <tbody id="catTable" class="bg-white"></tbody>
        </table>
    </div>

    <div class="bg-white p-6 rounded shadow-md mb-6 border-l-8 border-green-500">
        <h3 class="font-bold mb-4 text-xl text-green-700">เพิ่มรายการเกมใหม่</h3>
        <div class="flex gap-3 flex-wrap items-center">
            <input id="name" placeholder="ชื่อเกม" class="border p-2 rounded w-56">
            <select id="category" class="border p-2 rounded w-48 bg-gray-50"></select>
            <input id="image" type="file" class="text-sm border p-1 rounded">
            <input id="desc" placeholder="รายละเอียดเกม" class="border p-2 rounded flex-1">
            <button id="addBtn" onclick="addGame()" class="bg-green-500 text-white px-8 py-2 rounded hover:bg-green-600 font-bold shadow">
                Add Game
            </button>
        </div>
    </div>

<div class="bg-white rounded shadow-md overflow-hidden">
    <table class="w-full text-center text-sm">
        <thead class="bg-gray-200 text-black">
            <tr>
                <th class="p-4 border font-bold">รูปเกม</th>
                <th class="p-4 border font-bold">ชื่อเกม</th>
                <th class="p-4 border font-bold">หมวดหมู่</th>
                <th class="p-4 border font-bold">จัดการ</th>
            </tr>
        </thead>
        <tbody id="gameTable" class="text-gray-800">
            </tbody>
    </table>
</div>

<div id="editPopup" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-[480px]">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 border-b pb-2">แก้ไขข้อมูลเกม</h2>
        <div class="space-y-4">
            <input id="editName" class="border w-full p-2 rounded" placeholder="ชื่อเกม">
            <select id="editCategory" class="border w-full p-2 rounded bg-gray-50"></select>
            <input id="editImage" type="file" class="w-full text-sm">
            <textarea id="editDesc" class="border w-full p-2 rounded h-24" placeholder="รายละเอียด"></textarea>
        </div>
        <div class="flex gap-3 mt-8">
            <button onclick="closeEdit()" class="bg-gray-400 text-white px-4 py-2 rounded flex-1 font-bold shadow hover:bg-gray-500">ยกเลิก</button>
            <button onclick="saveEdit()" 
                    style="background-color: #16a34a; color: #ffffff !important;" 
                    class="px-4 py-2 rounded flex-1 font-bold shadow hover:opacity-90 transition">
                บันทึกข้อมูล
            </button>
        </div>
    </div>
</div>
<div id="editCatPopup" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-[60]">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-80">
        <h2 class="text-xl font-bold mb-6 text-center text-indigo-600 border-b pb-2">แก้ไขชื่อหมวดหมู่</h2>
        <input id="editCatName" class="border w-full p-2 mb-6 rounded outline-none focus:ring-2 focus:ring-indigo-500">
        <div class="flex gap-3">
            <button onclick="closeEditCat()" class="bg-gray-400 text-white px-4 py-2 rounded flex-1 font-bold shadow hover:bg-gray-500 cursor-pointer">
                ยกเลิก
            </button>
            <button onclick="saveEditCat()" 
                    style="background-color: #16a34a; color: white !important;" 
                    class="px-4 py-2 rounded flex-1 font-bold shadow hover:opacity-90 transition cursor-pointer">
                บันทึก
            </button>
        </div>
    </div>
</div>

<script type="module" src="admin.js"></script>

<script>
    function login(){
        let u = document.getElementById("user").value;
        let p = document.getElementById("pass").value;
        if(u === "admin" && p === "1234"){
            sessionStorage.setItem("isAdminLoggedIn", "true");
            showAdmin();
        } else { 
            alert("Username หรือ Password ไม่ถูกต้อง!"); 
        }
    }

    function showAdmin(){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("adminPage").classList.remove("hidden");
        document.getElementById("adminPage").style.display = "block";
        if (window.loadGames) window.loadGames();
    }

    function goHome(){ 
        sessionStorage.removeItem("isAdminLoggedIn"); 
        window.location.href = "index.html"; 
    }

    function logout(){ 
        sessionStorage.removeItem("isAdminLoggedIn"); 
        location.reload(); 
    }

    window.onload = function() {
        document.getElementById("adminPage").classList.add("hidden");
        document.getElementById("loginPage").style.display = "flex";
    };
</script>
</body>
</html>
